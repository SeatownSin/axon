name: CI

# Keeps the tree buildable and consistently formatted. Nothing here ran before
# v0.3.0, which is how 445 unformatted files and four unix-only test/example
# targets that broke the Windows build all reached main unnoticed.
#
# Deliberately *not* a test run: the library suite is long and this repo builds
# on free runners. Correctness is verified locally (see docs/); these jobs cover
# the two failure modes nobody notices by hand -- drift in formatting, and code
# that only compiles on the platform its author happened to use.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          # No build here, so nothing to cache.
          cache: false

      - run: cargo fmt --all -- --check

  check:
    name: check ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux, runner: ubuntu-latest }
          # Windows is a first-class target here and the one that catches
          # unix-only code: it is where `cargo check --all-targets` had been
          # failing in four crates.
          - { label: windows, runner: windows-2022 }
    steps:
      - uses: actions/checkout@v5

      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - name: Export PROTOC path
        shell: bash
        run: echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1

      # `--all-targets` covers tests, examples and benches -- the targets a
      # plain `cargo build` never compiles, and where the Windows breakage hid.
      - run: cargo check --workspace --all-targets

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - name: Export PROTOC path
        shell: bash
        run: echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      # The toolchain action already puts `-D warnings` in RUSTFLAGS, so this
      # fails on rustc warnings (unused imports, dead code) as well as lints.
      - run: cargo clippy --workspace --all-targets
